name: Build Android Debug APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ANDROID_SOURCE_BUNDLE.md"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download verified Stage 2.3 source bundle
        env:
          SOURCE_FILE_ID: "196QeTYDYxk6FskZHrcHoS-UBgFs6mC_u"
          SOURCE_SHA256: "bdb97532b359d4df948e623d134e74a9dfbb1c770d59fea25dda061a13e72b6c"
        run: |
          python -m pip install --disable-pip-version-check gdown
          gdown "https://drive.google.com/uc?id=${SOURCE_FILE_ID}" -O /tmp/today-rhythm-source.zip
          echo "${SOURCE_SHA256}  /tmp/today-rhythm-source.zip" | sha256sum -c -
          unzip -o /tmp/today-rhythm-source.zip -d "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/android/TodayRhythmAndroid/settings.gradle.kts"
          test -f "$GITHUB_WORKSPACE/android/TodayRhythmAndroid/app/src/main/assets/index-android.html"
          test -f "$GITHUB_WORKSPACE/android/TodayRhythmAndroid/gradle/wrapper/gradle-wrapper.jar"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: today-rhythm-debug-signing-key-v1

      - name: Grant execute permission for Gradle wrapper
        working-directory: android/TodayRhythmAndroid
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android/TodayRhythmAndroid
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/TodayRhythmAndroid/app/build/outputs/apk/debug/app-debug.apk \
             android/TodayRhythmAndroid/app/build/outputs/apk/debug/TodayRhythm-v1.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodayRhythm-debug-apk
          path: android/TodayRhythmAndroid/app/build/outputs/apk/debug/TodayRhythm-v1.0-debug.apk
          if-no-files-found: error
          retention-days: 14
